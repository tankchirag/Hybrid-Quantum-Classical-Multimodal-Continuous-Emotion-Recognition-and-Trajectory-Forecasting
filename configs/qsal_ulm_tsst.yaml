# ============================================================
# QSAL — Quantum Self‑Attention Layer (ULM‑TSST Synthetic)
# ============================================================

model:
  name: "QSAL"

  emb_dim: 128
  proj_dim: 64
  transformer_dim: 256

  num_heads: 4
  num_layers: 4

  target_seq_len: 50

  modalities:
    audio: true
    video: true
    ecg: true
    eda: true
    eeg: true
    emg: true
    resp: true
    bpm: true
    eye: true
    text: true

  qsal:
    num_qubits: 6
    circuit_depth: 2
    fusion_dim: 256
    num_heads: 4

dataset:
  name: "ulm_tsst_synthetic"
  synthetic: true
  target_seq_len: 50
  num_samples: 200
  label_dim: 3
  forecast_horizon: 25

training:
  batch_size: 4
  epochs: 1
  lr: 0.0003
  weight_decay: 0.0
  patience: 5
  device: "cpu"

logging:
  run_dir: "runs/qsal_ulm/"
  log_interval: 20
