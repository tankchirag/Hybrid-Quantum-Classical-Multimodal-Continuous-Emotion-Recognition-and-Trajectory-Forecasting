# ==========================================================
# Baseline B2
# Concatenation Fusion Baseline
# ==========================================================

experiment:

  name: "baseline_b2"

  description: >
    Multimodal projection and concatenation fusion
    baseline for continuous emotion recognition
    and future trajectory forecasting.


# ==========================================================
# Dataset
# ==========================================================

dataset:

  name: "ulm_tsst_v1"

  type: "disk"

  config_path: "configs/datasets/ulm_tsst_v1.yaml"

  root_dir: "data/generated/ulm_tsst_v1"

  train_split: "train"

  val_split: "val"

  test_split: "test"


# ==========================================================
# Modalities
# ==========================================================

modalities:

  ecg: true

  eda: true

  eeg: true

  emg: true

  resp: true

  bpm: true

  eye: true

  audio: true

  video: true

  text: true


# ==========================================================
# Continuous Labels
# ==========================================================

continuous_labels:

  - valence

  - arousal

  - dominance

  - stress

  - workload

  - fatigue


# ==========================================================
# Discrete Labels
# ==========================================================

discrete_labels:

  - emotion_class

  - stress_class

  - workload_class

  - alertness_class

  - drowsiness_class


# ==========================================================
# Recognition
# ==========================================================

recognition:

  enabled: true


# ==========================================================
# Forecasting
# ==========================================================

forecasting:

  enabled: true

  horizon: 25


# ==========================================================
# History
# ==========================================================

history:

  enabled: true

  history_length: 50

  use_continuous_history: true

  use_discrete_history: true

  source: "ground_truth"

  future_inference_source: "prediction"


# ==========================================================
# Model
# ==========================================================

model:

  name: "baseline_b2"

  emb_dim: 128

  proj_dim: 64

  transformer_dim: 256

  num_heads: 4

  num_layers: 4

  dropout: 0.1


# ==========================================================
# Heads
# ==========================================================

recognition_head:

  enabled: true

forecast_head:

  enabled: true


# ==========================================================
# Training
# ==========================================================

training:

  batch_size: 8

  epochs: 3

  patience: 10

  gradient_clip: 1.0

  max_train_batches: 1000

  max_val_batches: 200


# ==========================================================
# Optimizer
# ==========================================================

optimizer:

  name: "adamw"

  lr: 0.0003

  weight_decay: 0.00001


# ==========================================================
# Scheduler
# ==========================================================

scheduler:

  name: "reduce_on_plateau"

  factor: 0.5

  patience: 3

  min_lr: 0.000001


# ==========================================================
# Loss
# ==========================================================

loss:

  alpha: 0.2

  recognition_weight: 1.0

  forecast_weight: 1.0


# ==========================================================
# Runtime
# ==========================================================

runtime:

  device: "auto"

  deterministic: true

  seed: 42


# ==========================================================
# Logging
# ==========================================================

logging:

  run_dir: "runs/baseline_b2"

  save_best_only: true

  save_history: true

  save_config: true

  log_interval: 20