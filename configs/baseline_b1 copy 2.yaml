# ==========================================================
# Baseline B1
# Classical Attention Fusion
# ==========================================================

experiment:

  name: "baseline_b1"

  description: >
    Classical attention-based multimodal fusion baseline.

# ==========================================================
# Dataset
# ==========================================================

dataset:

  name: "ulm_tsst_synthetic"

  synthetic: true

  num_samples: 200

  duration_seconds: 300

  label_sampling_rate: 25

# ==========================================================
# Modalities
# ==========================================================

modalities:

  audio: true

  video: true

  ecg: true

  eda: true

  eeg: true

  emg: true

  resp: true

  bpm: true

  eye: true

  text: true

# ==========================================================
# Continuous Labels
# ==========================================================

continuous_labels:

  - valence

  - arousal

  - dominance

  - stress

  - workload

  - fatigue

# ==========================================================
# Discrete Labels
# ==========================================================

discrete_labels:

  - emotion_class

  - stress_class

  - workload_class

  - alertness_class

  - drowsiness_class

  - kss_score

# ==========================================================
# Tasks
# ==========================================================

recognition:

  enabled: true

forecasting:

  enabled: true

  horizon: 25

# ==========================================================
# History
# ==========================================================

history:

  enabled: true

  history_length: 50

  use_continuous_history: true

  use_discrete_history: true

  source: "ground_truth"

# ==========================================================
# Model
# ==========================================================

model:

  emb_dim: 128

  fusion_dim: 128

  transformer_dim: 256

  num_heads: 4

  num_layers: 4

# ==========================================================
# Training
# ==========================================================

training:

  batch_size: 8

  epochs: 100

  lr: 0.0003

  weight_decay: 0.00001

  patience: 10

# ==========================================================
# Optimizer
# ==========================================================

optimizer:

  name: "adamw"

# ==========================================================
# Scheduler
# ==========================================================

scheduler:

  name: "reduce_on_plateau"

  factor: 0.5

  patience: 3

# ==========================================================
# Runtime
# ==========================================================

runtime:

  device: "auto"

# ==========================================================
# Logging
# ==========================================================

logging:

  run_dir: "runs/baseline_b1"

  save_best_only: true