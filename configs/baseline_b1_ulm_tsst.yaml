# ============================================================
# Baseline B1 — Classical Multimodal Fusion (ULM‑TSST Synthetic)
# ============================================================

model:
  name: "baseline_b1"

  emb_dim: 128
  fusion_dim: 128
  transformer_dim: 256

  num_heads: 4
  num_layers: 4

  target_seq_len: 50

  modalities:
    audio: true
    video: true
    ecg: true
    eda: true
    eeg: true
    emg: true
    resp: true
    bpm: true
    eye: true
    text: true

dataset:
  name: "ulm_tsst_synthetic"
  synthetic: true
  target_seq_len: 50
  num_samples: 200
  label_dim: 3            # VAD
  forecast_horizon: 25

training:
  batch_size: 8
  epochs: 3
  lr: 0.0003
  weight_decay: 0.0
  patience: 5
  device: "auto"

logging:
  checkpoint_dir: "runs/baseline_b1_ulm/"
  log_interval: 20
