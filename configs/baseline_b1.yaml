dataset:
  name: synthetic
  length: 5000        # realistic dataset size
  T: 100              # 4 seconds @ 25 FPS (video) or 100 audio frames
  S: 20               # 1–2 second forecasting horizon

model:
  emb_dim: 256        # realistic embedding size (wav2vec2=768, ResNet=512 → projected to 256)
  fusion_dim: 128     # realistic fusion bottleneck
  transformer_dim: 512
  num_heads: 8        # standard for 512-dim transformer
  num_layers: 4       # deep enough for thesis-level modeling
  include_text: true
  synthetic: true

training:
  batch_size: 16      # GPU-friendly
  lr: 0.0001
  epochs: 3
  device: auto
  patience: 3
