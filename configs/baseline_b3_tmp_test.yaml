dataset:
  forecast_horizon: 20
  name: sewa
  synthetic: false
  target_seq_len: 100
logging:
  checkpoint_dir: runs/baseline_b3/
  log_interval: 20
model:
  emb_dim: 128
  fused_dim: 64
  modalities:
    audio: true
    ecg: false
    eda: false
    text: true
    video: true
  name: baseline_b3
  num_heads: 2
  num_layers: 2
  pqc:
    depth: 3
    num_qubits: 8
  proj_dim: 16
  transformer_dim: 256
training:
  batch_size: 4
  device: cpu
  epochs: 1
  lr: 0.0001
  patience: 3
  weight_decay: 0.0
