# ============================================================
# Baseline B3 — Multimodal Entangled PQC Fusion (Unified 4Q/6Q/8Q)
# ============================================================

dataset:
  name: recola          # or "sewa"
  T: 300                # sequence length
  S: 50                 # forecasting horizon

model:
  name: baseline_b3

  # Feature extractor output dim
  emb_dim: 128

  # PQC fusion parameters (classical side)
  proj_dim: 16              # 128 → 16 per modality
  fused_dim: 64             # 4 × 16
  transformer_dim: 256      # PQC output → transformer input

  num_heads: 2
  num_layers: 2

  # PQC configuration (Unified PQC)
  pqc:
    num_qubits: 8           # choose: 4, 6, or 8
    depth: 3                # PQC layers

training:
  batch_size: 4
  lr: 0.0001
  epochs: 2
  patience: 3
  device: cpu               # PQC uses lightning.qubit (CPU backend)

logging:
  checkpoint_dir: "runs/baseline_b3/"
