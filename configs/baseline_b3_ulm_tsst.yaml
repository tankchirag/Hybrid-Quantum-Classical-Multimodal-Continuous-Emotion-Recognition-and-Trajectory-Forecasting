# ============================================================
# Baseline B3 — PQC Fusion (ULM‑TSST Synthetic)
# ============================================================

model:
  name: "baseline_b3"

  emb_dim: 128
  proj_dim: 16
  fused_dim: 64
  transformer_dim: 256

  num_heads: 2
  num_layers: 2

  target_seq_len: 50

  modalities:
    audio: true
    video: true
    ecg: true
    eda: true
    eeg: true
    emg: true
    resp: true
    bpm: true
    eye: true
    text: true

  pqc:
    num_qubits: 6
    depth: 3

dataset:
  name: "ulm_tsst_synthetic"
  synthetic: true
  target_seq_len: 50
  num_samples: 200
  label_dim: 3
  forecast_horizon: 25

training:
  batch_size: 4
  epochs: 1
  lr: 0.0001
  weight_decay: 0.0
  patience: 3
  device: "cpu"

logging:
  checkpoint_dir: "runs/baseline_b3_ulm/"
  log_interval: 20
