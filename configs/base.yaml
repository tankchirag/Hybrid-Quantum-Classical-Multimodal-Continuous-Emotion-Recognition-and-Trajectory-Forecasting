dataset:
  name: synthetic
  length: 5000
  T: 50
  S: 10

model:
  modality_dim: 128
  num_modalities: 4

  fusion:
    type: qsal            # options: classical, qsal
    fusion_dim: 64        # 128 → 64 projection
    num_heads: 2          # modality attention heads
    num_qubits: 4         # PQC width
    circuit_depth: 2      # PQC depth
    transformer_dim: 256  # output → Transformer input

  transformer:
    d_model: 256
    nhead: 4
    num_encoder_layers: 4
    num_decoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1

training:
  batch_size: 16
  lr: 0.0001
  epochs: 2
  device: "auto"

history_encoder:

  enabled: false

  auto_scale: true

  ratio: 4

  hidden_dim: null

  num_layers: 2

  history_dropout: 0.20

  injection_point: "post_fusion"